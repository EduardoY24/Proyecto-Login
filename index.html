<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/login.css" rel="stylesheet">
</head>
<body>
  <!-- ===== Navbar (Integrante A) ===== -->

  <!-- ===== Sidebar (Integrante B) ===== -->
     <!-- Barra con el botón hamburguesa que abre y cierra el sidebar -->
  <div class="bg-body-tertiary border-bottom px-3 py-2">
    <button id="botonHamburguesa" class="btn btn-outline-secondary btn-sm" type="button" aria-label="Abrir o cerrar el menú">
      <img src="img/icono-menu.svg" alt="" width="20" height="20">
    </button>
    <span class="ms-2 text-body-secondary small">Menú</span>
  </div>

  <!-- Sidebar: panel lateral que se desliza desde la izquierda (Offcanvas de Bootstrap) -->
  <aside class="offcanvas offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebarTitulo">
    <!-- Encabezado del panel, con el botón X para cerrarlo -->
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title" id="sidebarTitulo">Menú del sistema</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>

    <!-- Cuerpo del panel: la lista de opciones -->
    <div class="offcanvas-body p-0">
      <ul class="nav flex-column" id="menuSidebar">
        <li class="nav-item">
          <a class="nav-link sidebar-enlace" href="#" id="enlaceInicio">
            <img src="img/icono-inicio.svg" alt="" width="20" height="20"> Inicio
          </a>
        </li>
        
        <li class="nav-item">
          <!-- data-bs-toggle="collapse": Bootstrap abre y cierra el submenú solo -->
          <a class="nav-link sidebar-enlace" href="#submenuUsuarios" data-bs-toggle="collapse" role="button" aria-expanded="false" aria-controls="submenuUsuarios">
            <img src="img/icono-usuarios.svg" alt="" width="20" height="20"> Usuarios
          </a>
          <div class="collapse" id="submenuUsuarios">
            <ul class="nav flex-column sidebar-submenu">
              <li class="nav-item">
                <a class="nav-link sidebar-enlace" href="#" id="enlaceCaptura">Captura</a>
              </li>
            </ul>
          </div>
        </li>

        <li class="nav-item">
          <a class="nav-link sidebar-enlace" href="#" id="enlaceAlumnos">
            <img src="img/icono-alumnos.svg" alt="" width="20" height="20"> Alumnos
          </a>
        </li>
      </ul>
    </div>
  </aside>
  <!-- ===== Contenido principal ===== -->
  <main id="contenido">
    <!-- Sección Usuarios > Captura (Integrante A): id="seccionCaptura" -->
    
    
    <!-- Formulario de alumnos + modal de edad (Integrante B) -->
         <!-- Sección de bienvenida (Integrante B) -->
    <section id="seccionInicio" class="container py-4">
      <h2>Bienvenido al sistema</h2>
      <p class="text-body-secondary">Abre el menú con el botón de arriba para capturar usuarios o registrar alumnos.</p>
    </section>

    <!-- Sección Alumnos (Integrante B) -->
    <section id="seccionAlumnos" class="container py-4 d-none">
      <h2>Registro de alumnos</h2>

      <!-- novalidate: la validación la hacemos nosotros con JavaScript -->
      <form id="formAlumno" class="col-md-6" novalidate>
        <div class="mb-3">
          <label for="alumnoNombre" class="form-label">Nombre del alumno</label>
          <input type="text" class="form-control" id="alumnoNombre">
          <div class="text-danger small" id="errorAlumnoNombre"></div>
        </div>

        <div class="mb-3">
          <label for="alumnoNumeroControl" class="form-label">Número de control (6 dígitos)</label>
          <input type="text" class="form-control" id="alumnoNumeroControl" inputmode="numeric">
          <div class="text-danger small" id="errorAlumnoNumeroControl"></div>
        </div>

        <div class="mb-3">
          <label for="alumnoFechaNacimiento" class="form-label">Fecha de nacimiento</label>
          <input type="date" class="form-control" id="alumnoFechaNacimiento">
          <div class="text-danger small" id="errorAlumnoFecha"></div>
        </div>

        <button type="submit" class="btn btn-primary">Registrar alumno</button>
      </form>

      <div class="alert alert-success mt-3 d-none" id="mensajeAlumnoExito" role="alert">
        Alumno registrado correctamente.
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utileria.js"></script>
  <script src="js/sistema.js"></script>
</body>
</html>
